name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety
          POSTGRES_DB: sweety_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Integration tests run against this real PostgreSQL (and truncate its tables).
      TEST_DATABASE_URL: postgres://sweety:sweety@localhost:5432/sweety_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    name: Client tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sweety"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: 'true'
      # The suite creates and seeds its own database, starts the API on :4100 and serves the
      # production build on :4173 with the real security headers.
      E2E_DATABASE_URL: postgres://sweety:sweety@localhost:5432/sweety_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
